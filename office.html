<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Escritório 3D — MinhaImob</title>
  <meta name="description" content="Escritório virtual 3D com corretores de IA" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23D9A55B'/><path d='M14 34 32 18l18 16v14H38V38H26v10H14z' fill='%2312100B'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/app.css" />
  <style>
    html, body { overflow: hidden; background: #070a11; }
    #scene { position: fixed; inset: 0; }
    #scene canvas { display: block; outline: none; }
    .hud { position: fixed; z-index: 10; pointer-events: none; }
    .hud > * { pointer-events: auto; }
    .glass { background: color-mix(in srgb, var(--surface) 78%, transparent); backdrop-filter: blur(14px); border: 1px solid var(--border); border-radius: 14px; }
    #top-l { top: 14px; left: 14px; display: flex; gap: 10px; align-items: center; padding: 8px 12px; }
    #top-r { top: 14px; right: 14px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 62vw; }
    #top-r .k { padding: 8px 12px; min-width: 96px; }
    #top-r .k small { color: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; display: block; }
    #top-r .k b { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
    #roster { left: 14px; bottom: 14px; right: 14px; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    #roster .agent-card { background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(14px); min-width: 210px; padding: 10px; }
    #roster .st { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
    #panel { position: fixed; z-index: 20; top: 14px; right: 14px; bottom: 96px; width: min(440px, calc(100vw - 28px)); transform: translateX(calc(100% + 30px)); transition: transform .3s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; overflow: hidden; }
    #panel.open { transform: none; }
    #panel .chat { min-height: 0; }
    #actions { top: 72px; left: 14px; display: flex; flex-direction: column; gap: 6px; }
    .tag3d { pointer-events: auto; cursor: pointer; transform: translateY(-6px); text-align: center; font-family: var(--font); user-select: none; }
    .tag3d .n { display: inline-block; padding: 3px 9px; border-radius: 20px; font-weight: 800; font-size: 12px; color: #0d0f14; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
    .tag3d .s { display: block; margin-top: 3px; font-size: 11px; font-weight: 700; color: #E9EDF5; background: rgba(10,14,22,.78); padding: 2px 8px; border-radius: 8px; white-space: nowrap; border: 1px solid rgba(255,255,255,.08); }
    .bubble3d { font-size: 18px; animation: pop2 .3s; filter: drop-shadow(0 3px 6px rgba(0,0,0,.4)); }
    #hint { left: 50%; transform: translateX(-50%); bottom: 96px; font-size: 12px; color: var(--muted); padding: 6px 12px; }
    #loading { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #070a11; transition: opacity .6s; }
    #daily { position: fixed; z-index: 25; left: 14px; top: 196px; width: min(520px, calc(100vw - 28px)); max-height: calc(100vh - 300px); overflow: auto; padding: 18px; display: none; }
    @media (max-width: 760px) { #daily { top: 70px; max-height: 60vh; } }
    @media (max-width: 760px) {
      #top-r { display: none; }
      #panel { top: auto; bottom: 0; right: 0; left: 0; width: 100%; height: 72vh; border-radius: 18px 18px 0 0; transform: translateY(105%); }
      #panel.open { transform: none; }
      #roster .agent-card { min-width: 170px; }
      #hint { display: none; }
    }
  </style>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
</head>
<body>
  <div id="loading"><div class="center"><div class="brand-mark" style="margin:0 auto;width:48px;height:48px;font-size:18px">MI</div><p class="muted mt">Montando o escritório…</p></div></div>
  <div id="scene"></div>
  <div class="hud glass" id="top-l"><a class="btn sm ghost" href="app.html">← Plataforma</a><div><div style="font-weight:800;font-size:14px">Escritório MinhaImob</div><div class="muted" style="font-size:11.5px" id="clock">—</div></div></div>
  <div class="hud" id="top-r"></div>
  <div class="hud" id="actions">
    <button class="btn sm glass" id="b-daily">☀ Daily de vendas</button>
    <button class="btn sm glass" id="b-tour">⟲ Tour automático</button>
    <button class="btn sm glass" id="b-reset">◎ Visão geral</button>
  </div>
  <div class="hud glass" id="hint">Arraste para girar · role para zoom · clique num corretor para conversar</div>
  <div class="hud" id="roster"></div>
  <aside id="panel" class="glass"></aside>
  <div id="daily" class="glass"></div>
  <script type="module" src="assets/js/office.js"></script>
</body>
</html>
